{% extends "base.html" %}
{% block title %}Unlock{% endblock %}
{% block page %}unlock{% endblock %}
{% block body %}
<main id="main" class="page" style="max-width:460px;margin-top:40px">
  <section class="plate">
    <div class="plate-head"><h2>Tablet access</h2></div>
    {% if pin_set %}
    <form method="post" style="display:flex;flex-direction:column;gap:14px;padding:0 8px">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label class="field">Enter the Watch Log PIN
        <input class="odo" name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus required></label>
      <button class="btn primary" type="submit">Unlock</button>
    </form>
    {% else %}
    <p style="margin:0 8px">No PIN has been set. On the ECR PC, open <b>Settings → Tablet access (LAN)</b> and set a PIN first.</p>
    {% endif %}
  </section>
</main>
{% endblock %}
